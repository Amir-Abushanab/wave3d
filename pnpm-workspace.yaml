packages:
  - "apps/*"
  - "packages/*"

# pnpm reads package settings from here (not the package.json "pnpm" field).
# Allow esbuild (a Vite dependency) to run its install script so its native
# binary is set up; pnpm blocks dependency build scripts by default.
allowBuilds:
  esbuild: true

# tweakpane 4 ships types that re-export @tweakpane/core but doesn't declare it as a
# dependency (it was resolved via hoisting in the old single-package layout). Declare it as a
# peer so pnpm nests @tweakpane/core under tweakpane in the workspace, keeping the Pane types
# (addFolder/refresh/binding events) resolvable. The studio provides it as a devDependency.
packageExtensions:
  tweakpane:
    peerDependencies:
      "@tweakpane/core": "*"

# Supply-chain cooldown, in two layers. This is the install-time one: never install a version
# published less than 7 days ago (10080 minutes), transitive dependencies included. Without it,
# pnpm resolves anything inside a `^` range however fresh (its built-in default is one day,
# non-strict). The other layer, `cooldown: 7` in .ncurc.cjs, only governs which versions
# npm-check-updates proposes for direct deps. Setting this explicitly makes it strict, and
# `pnpm install --frozen-lockfile` re-checks every lockfile entry against it, so a lockfile
# resolved without it fails until it is re-resolved.
minimumReleaseAge: 10080
