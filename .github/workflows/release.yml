name: Release

# Changesets-driven publishing. On every push to main:
#   • pending changesets → opens/updates a "Version Packages" PR (bumps versions + changelogs)
#   • that PR merged      → publishes the bumped @wave3d/* packages to npm, tags, GitHub Release
#
# Auth is OIDC / Trusted Publishing — no stored token. One-time prerequisites (see DEPLOY.md):
#   1. Publish 0.1.0 once from your laptop (`npm login` → `pnpm release`); npm can't do a
#      package's FIRST publish over OIDC.
#   2. On each package's npm settings add a Trusted Publisher: repo Amir-Abushanab/wave3d,
#      workflow release.yml. After that, CI publishes tokenlessly.
# The preflight job skips publishing until the packages exist on npm, so runs before step 1 stay green.
#
# changesets/action@v2, not @v1: v1 grepped the publish output for "New tag:" lines to learn
# what shipped, and the changesets v3 CLI doesn't always print them — liquid-glass-js 0.5.0
# hit npm on 2026-08-24 from a green run that pushed no tags and created no GitHub releases.
# v2 reads the CLI's CHANGESETS_OUTPUT file instead and pushes tags + releases via the
# GitHub API.

on:
  push:
    branches: [main]
    # Only when something publishable changes. A studio-only / docs / CI push has nothing to
    # publish, so skip the whole workflow rather than attempt a (crash-prone) no-op re-publish.
    paths:
      - "packages/**"
      - ".changeset/**"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version PR, tags, GitHub releases
  pull-requests: write # the Version Packages PR
  id-token: write # OIDC trusted publishing + provenance

jobs:
  preflight:
    name: Publish gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        run: |
          if npm view @wave3d/core version >/dev/null 2>&1; then
            echo "publish=pnpm release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::@wave3d/* not on npm yet — managing Version PRs only. Publish 0.1.0 from your laptop, then enable Trusted Publishing (see DEPLOY.md)."
          fi

  release:
    name: Version or publish
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate both the version PR and the publish on the suite. ci.yml runs on these same pushes but
      # is a SEPARATE workflow with no dependency here, so without this step a red suite could still
      # publish to npm — the one thing this pipeline does that can't be taken back. Deliberately
      # `test` and not `check`: it covers the code being shipped without letting a studio-only lint
      # or typecheck failure block a package release.
      - run: pnpm test
      # Trusted publishing needs npm >= 11.5.1; Node 24 may ship an older npm.
      - run: npm install -g npm@latest
      - name: Version Packages PR / publish
        id: changesets
        # Soft-fail on purpose. This action manages BOTH the version PR and the publish, and it
        # reports PR-API problems as a bare `HttpError` — an Octokit RequestError whose message is
        # empty, so `Error.toString()` degrades to just the name. That tells you nothing and kills
        # the run. The guard step below decides the real outcome and prints the actual API error.
        continue-on-error: true
        uses: changesets/action@v2
        with:
          # `pnpm run version` = changeset version + sync the skill's library_version, so the skill
          # bump rides this same PR instead of drifting behind the packages.
          version-script: pnpm run version
          # Empty until the packages exist on npm (see preflight) → PR-only, no publish attempt.
          publish-script: ${{ needs.preflight.outputs.publish }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        # No GITHUB_TOKEN env: v2 only reads its github-token input, which already
        # defaults to this workflow's token.
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Fallback if OIDC publishing misbehaves (pnpm's OIDC support is still maturing):
          # add a granular NPM_TOKEN secret and uncomment the next line.
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Decide the run's real outcome, and self-heal the failure the action cannot report on.
      # Two flakes observed so far, both leaving the version branch pushed but no PR open:
      #   • create path — empty-body HttpError, nothing opened (2026-07-24, reproducible)
      #   • update path — "State cannot be changed. The pull request cannot be reopened.", when the
      #     PR it listed as open gets merged mid-run (2026-07-22, a race with a human merge)
      # `gh` prints the real status, so a genuine block — e.g. the account-level "Allow GitHub
      # Actions to create and approve pull requests" toggle — surfaces as a message, not "HttpError".
      - name: Ensure Version Packages PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=changeset-release/main
          failed='${{ steps.changesets.outcome }}'

          # Ask the API rather than git: actions/checkout clones shallow, so a local
          # `rev-list origin/main..origin/$branch` can miss the merge base and lie.
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" --jq '.ahead_by' 2>/dev/null || echo "")

          # No version branch, or nothing on it: there was no PR to open, so the action's outcome
          # is the whole story — a failure here was in the publish path and must stay red.
          if [ -z "$ahead" ] || [ "$ahead" = "0" ]; then
            echo "::notice::no version commits on $branch — nothing to open"
            if [ "$failed" = "failure" ]; then exit 1; fi
            exit 0
          fi

          if [ "$(gh pr list --head "$branch" --base main --state open --json number --jq 'length')" != "0" ]; then
            echo "::notice::version PR already open"
            exit 0
          fi

          echo "No open version PR but $branch is $ahead commit(s) ahead — opening it here."
          gh pr create --base main --head "$branch" \
            --title "chore: version packages" \
            --body "Automated version bump from changesets. Merging this publishes the bumped \`@wave3d/*\` packages to npm. Opened by the release workflow's self-heal step because \`changesets/action\` could not create it."
